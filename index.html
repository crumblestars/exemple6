function decodePage(name){
 const b=PAGES[name];
 if(!b)return null;
 const bin=atob(b);
 const bytes=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
 return new TextDecoder('utf-8').decode(bytes);
}
function render(name){
 const html=decodePage(name);
 const doc=new DOMParser().parseFromString(html,'text/html');
 // clean previously injected page head nodes
 document.head.querySelectorAll('[data-page-head]').forEach(n=>n.remove());
 doc.head.querySelectorAll('style,link[rel=stylesheet],meta[name=description]').forEach(n=>{
  const c=document.importNode(n,true);
  c.setAttribute('data-page-head','');
  document.head.appendChild(c);
 });
 document.title=doc.title||'Studio Zürich';
 // body attributes
 for(const a of Array.from(document.body.attributes))document.body.removeAttribute(a.name);
 for(const a of Array.from(doc.body.attributes))document.body.setAttribute(a.name,a.value);
 const scripts=Array.from(doc.body.querySelectorAll('script'));
 scripts.forEach(sc=>sc.remove());
 document.body.innerHTML=doc.body.innerHTML;
 // re-execute page scripts so interactions keep working
 scripts.forEach(sc=>{
  const n=document.createElement('script');
  for(const a of Array.from(sc.attributes))n.setAttribute(a.name,a.value);
  n.textContent=sc.textContent;
  document.body.appendChild(n);
 });
 window.scrollTo(0,0);
}
function show(name,push){
 if(!PAGES[name])name='index.html';
 if(push)history.pushState({page:name},'',location.pathname+'#'+encodeURIComponent(name));
 render(name);
}
addEventListener('message',e=>{if(e.data&&e.data.studioZurichPage)show(e.data.studioZurichPage,true)});
addEventListener('popstate',()=>show(decodeURIComponent(location.hash.slice(1)),false));
function boot(){
 const start=decodeURIComponent(location.hash.slice(1));
 show(PAGES[start]?start:'index.html',false);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
