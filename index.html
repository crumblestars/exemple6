const frame=document.getElementById('site');
function decodePage(name){
 const b=PAGES[name];
 if(!b)return null;
 const bin=atob(b);
 const bytes=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
 return new TextDecoder('utf-8').decode(bytes);
}
function show(name,push){
 if(!PAGES[name])name='index.html';
 frame.srcdoc=decodePage(name);
 if(push)history.pushState({page:name},'',location.pathname+'#'+encodeURIComponent(name));
}
addEventListener('message',e=>{if(e.data&&e.data.studioZurichPage)show(e.data.studioZurichPage,true)});
addEventListener('popstate',()=>show(decodeURIComponent(location.hash.slice(1)),false));
let start=decodeURIComponent(location.hash.slice(1));
show(PAGES[start]?start:'index.html',false);
</script>
